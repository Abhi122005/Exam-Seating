name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Admin bypass: a commit message or PR title containing `[skip ci]` skips CI,
  # but ONLY for admins listed in the repo variable CI_ADMINS.
  decide:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
    steps:
      - name: Resolve admin skip-ci bypass
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          ADMINS: ${{ vars.CI_ADMINS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          MESSAGE="$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}" --jq '.commit.message' 2>/dev/null || true)"

          # Check both the commit message and pull request title.
          if printf '%s\n%s' "$MESSAGE" "$PR_TITLE" | grep -q '\[skip ci\]'; then
            HAS_SKIP_CI=true
          else
            HAS_SKIP_CI=false
          fi

          # Check whether the actor is listed in the CI_ADMINS repository variable.
          if printf '%s' "$ADMINS" | tr ',' '\n' | grep -qx "$ACTOR"; then
            IS_ADMIN=true
          else
            IS_ADMIN=false
          fi

          # Only an approved admin may bypass CI.
          if [ "$HAS_SKIP_CI" = true ] && [ "$IS_ADMIN" = true ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "CI skipped: $ACTOR is an approved admin."
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"

            if [ "$HAS_SKIP_CI" = true ]; then
              echo "Bypass denied: [skip ci] is admin-only."
            fi
          fi

  # Conventional-commit title check.
  pr-title:
    name: PR Title Convention
    needs: decide
    if: github.event_name == 'pull_request' && needs.decide.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit prefix
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|merge)(\(.+\))?: .+'; then
            echo "PR title must follow conventional commits: 'type(scope): subject'" >&2
            echo "Got: $TITLE" >&2
            exit 1
          fi

  quality:
    name: Lint / Typecheck / Test / Build
    needs: decide
    if: needs.decide.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from packageManager in package.json: pnpm@9.15.5
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (web)
        run: pnpm lint

      - name: Lint (parser, ruff)
        run: |
          python -m pip install --quiet ruff
          ruff check services/parser
          ruff format --check services/parser

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm --filter web build

      - name: Python parser syntax
        run: python -m py_compile services/parser/main.py services/parser/pdf_parser.py
