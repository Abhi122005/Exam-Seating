name: Auto-merge Dependabot
on: pull_request_target
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Sync lockfile
        run: |
          yes | pnpm install --no-frozen-lockfile
          if ! git diff --quiet pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "fix: sync lockfile"
            git push
          fi
      - name: Wait for CI checks
        uses: actions/github-script@v9
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let sha = process.env.PR_HEAD_SHA;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.payload.pull_request.number });
            sha = pr.head.sha;
            for (let i = 0; i < 90; i++) {
              const { data: checks } = await github.rest.checks.listForRef({ owner, repo, ref: sha });
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              
              // Filter out SonarQube and auto-merge checks
              const runs = checks.check_runs.filter(r => 
                r.name !== 'auto-merge' && 
                !r.name.includes('SonarQube') &&
                r.name !== 'SonarCloud Code Analysis'
              );
              const statuses = (status.statuses || []).filter(s => 
                !s.context.includes('SonarQube') &&
                s.context !== 'SonarCloud Code Analysis'
              );
              
              const hasAnything = runs.length > 0 || statuses.length > 0;
              if (!hasAnything) {
                if (i > 10) {
                  console.log('No CI checks configured; proceeding with merge');
                  return;
                }
              } else {
                const allRunsDone = runs.every(r => r.status === 'completed');
                const allStatusesDone = statuses.every(s => s.state !== 'pending');
                if (allRunsDone && allStatusesDone) {
                  const failed = runs.filter(r => !['success', 'neutral', 'skipped'].includes(r.conclusion));
                  const failedStatuses = statuses.filter(s => s.state === 'error' || s.state === 'failure');
                  if (failed.length || failedStatuses.length) {
                    throw new Error('Checks failed: ' +
                      [...failed.map(f => `${f.name}: ${f.conclusion}`),
                       ...failedStatuses.map(s => `${s.context}: ${s.state}`)].join(', '));
                  }
                  console.log('All checks passed: ' + runs.map(r => r.name).join(', '));
                  return;
                }
              }
              await new Promise(r => setTimeout(r, 20000));
            }
            throw new Error('Timed out waiting for checks');
      - name: Ready for manual merge
        run: echo "All checks passed. Merge manually (repo auto-merge is disabled)."
