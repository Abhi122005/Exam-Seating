<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon.svg">
<title>Staff Seating Schedule Manager | KTU Exam Seating</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:hsl(0 0% 100%);--fg:hsl(222.2 84% 4.9%);--card:var(--bg);--primary:hsl(221.2 83.2% 53.3%);--pfg:hsl(210 40% 98%);--muted:hsl(210 40% 96.1%);--mfg:hsl(215.4 16.3% 46.9%);--accent:hsl(210 40% 96.1%);--border:hsl(214.3 31.8% 91.4%);--rose:rgb(244 63 94);--amber:rgb(245 158 11)}
.dark{--bg:hsl(222.2 84% 4.9%);--fg:hsl(210 40% 98%);--primary:hsl(217.2 91.2% 59.8%);--pfg:hsl(222.2 47.4% 11.2%);--muted:hsl(217.2 32.6% 17.5%);--mfg:hsl(215 20.2% 65.1%);--accent:hsl(217.2 32.6% 17.5%);--border:hsl(217.2 32.6% 17.5%)}
body{color:var(--fg);background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(8px)}
.hd{max-width:64rem;margin:0 auto;padding:0 1rem;height:3.5rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:700;text-decoration:none;color:var(--fg)}
.logo b{width:1.75rem;height:1.75rem;border-radius:.5rem;background:var(--primary);color:var(--pfg);font-size:.75rem;display:flex;align-items:center;justify-content:center}
.hd nav{display:flex;align-items:center;gap:.5rem}
.staff{font-size:.75rem;font-weight:600;color:var(--mfg);text-decoration:none;display:flex;align-items:center;gap:.25rem;padding:.375rem .625rem;border-radius:.5rem}
.staff:hover{color:var(--fg);background:var(--accent)}
.tbtn{width:2rem;height:2rem;display:flex;align-items:center;justify-content:center;border-radius:.5rem;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer}
.tbtn:hover{background:var(--accent)}
.i-sun{display:none}.dark .i-sun{display:block}.dark .i-moon{display:none}
main{flex:1;width:100%;max-width:64rem;margin:0 auto;padding:1rem}
footer{border-top:1px solid var(--border);padding:1rem;text-align:center;font-size:.75rem;color:var(--mfg)}
.wrap{max-width:48rem;margin:0 auto}
.ic{width:1rem;height:1rem;flex-shrink:0;vertical-align:middle;display:inline-block}
.ic-sm{width:.875rem;height:.875rem}.ic-lg{width:2rem;height:2rem}
.h1{font-size:1.5rem;font-weight:700;letter-spacing:-.025em}
.sub{font-size:.75rem;color:var(--mfg);margin-top:.25rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.375rem;border:none;border-radius:.75rem;padding:.625rem 1rem;font-size:.75rem;font-weight:600;background:var(--primary);color:var(--pfg);cursor:pointer;text-decoration:none}
.btn:hover{opacity:.9}.btn:disabled{opacity:.5;cursor:default}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1.5rem}
.alert{display:flex;gap:.5rem;align-items:flex-start;padding:.75rem 1rem;border-radius:.75rem;font-size:.75rem;margin-bottom:1rem}
.a-err{border:1px solid color-mix(in srgb,var(--rose) 20%,transparent);background:color-mix(in srgb,var(--rose) 10%,transparent);color:#9f1239}.dark .a-err{color:#fecdd3}
.spinner{width:1rem;height:1rem;border:2px solid var(--primary);border-top-color:transparent;border-radius:9999px;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:2rem;color:var(--mfg);font-size:.875rem}
.tw{border:1px solid var(--border);border-radius:.75rem;background:var(--card);overflow:hidden;box-shadow:0 1px 2px rgb(0 0 0/.05)}
.ovh{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.75rem}
th{text-align:left;padding:.875rem;background:var(--muted);color:var(--mfg);font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:.875rem;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent)}
.badge{display:inline-flex;align-items:center;padding:.125rem .5rem;border-radius:9999px;font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.b-sched{border:1px solid color-mix(in srgb,var(--amber) 20%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent);color:#d97706}.dark .b-sched{color:#fbbf24}
.bold{font-weight:700}
.muted{color:var(--mfg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.danger{padding:.375rem;border:none;background:none;color:var(--rose);border-radius:.5rem;cursor:pointer;display:inline-flex}
.danger:hover{background:color-mix(in srgb,var(--rose) 10%,transparent)}
.danger:disabled{opacity:.5}
.right{text-align:right}
.empty{padding:2rem;text-align:center;color:var(--mfg);border:1px dashed var(--border);border-radius:1rem}
.empty h3{font-weight:600;font-size:.875rem;color:var(--fg);margin:.375rem 0}
.empty p{font-size:.75rem}
</style>
<script>try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
<header><div class="hd"><a class="logo" href="/"><b>KTU</b>Exam Seating</a><nav><a class="staff" href="/admin/login"><svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>Staff Portal</a><button class="tbtn" id="tbtn" aria-label="Toggle theme"><svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button></nav></div></header>
<main><div class="wrap">
<div class="head-row">
<div><h1 class="h1">Staff Seating Schedule Manager</h1><p class="sub">Manage uploaded exam seating slots and release schedules</p></div>
<a class="btn" href="/admin/upload"><svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Upload New Seating PDF</a>
</div>
<div id="err"></div>
<div id="rows" class="mt2"></div>
</div></main>
<footer>KTU Exam Cell Seating Portal &middot; Fast &amp; Free</footer>
<script>
document.getElementById('tbtn').onclick=function(){var d=document.documentElement.classList.toggle('dark');localStorage.setItem('theme',d?'dark':'light')};
var rows=document.getElementById('rows'),err=document.getElementById('err');
var esc=function(s){return String(s??'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var trash='<svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>';
var up='<svg class="ic ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;display:block;opacity:.6"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/></svg>';
load();
function load(){
  rows.innerHTML='<div class="loading"><span class="spinner"></span>Loading schedules...</div>';
  fetch('/api/admin/manifest').then(function(r){
    if(r.status===401){location.replace('/admin/login');throw new Error('redirect')}
    if(!r.ok)throw new Error('load');
    return r.json();
  }).then(function(m){
    err.innerHTML='';
    if(!m.length){rows.innerHTML='<div class="empty">'+up+'<h3>No Seating Schedules Created</h3><p>Click &quot;Upload New Seating PDF&quot; to publish seating arrangements.</p></div>';return}
    rows.innerHTML='<div class="tw ovh"><table><thead><tr><th>Exam Title</th><th>Session</th><th>Exam Date</th><th>Release Time</th><th class="right">Actions</th></tr></thead><tbody>'+m.map(function(e){
      return '<tr><td class="bold">'+esc(e.title)+'</td><td><span class="badge b-sched">'+esc(e.session)+'</span></td><td class="muted">'+esc(e.examDate)+'</td><td class="muted mono">'+esc(new Date(e.publishAt).toLocaleString())+'</td><td class="right"><button class="danger" data-id="'+esc(e.examId)+'" title="Delete seating file">'+trash+'</button></td></tr>';
    }).join('')+'</tbody></table></div>';
  }).catch(function(x){if(x.message==='redirect')return;err.innerHTML='<div class="alert a-err"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><div>Failed to load schedules</div></div>';rows.innerHTML=''});
}
rows.addEventListener('click',function(ev){
  var b=ev.target.closest('.danger');if(!b)return;
  var id=b.dataset.id;
  if(!confirm('Are you sure you want to delete exam '+id+'?'))return;
  b.disabled=true;
  fetch('/api/admin/exams/'+encodeURIComponent(id)+'/delete',{method:'POST'}).then(function(r){
    if(!r.ok)throw new Error('delete');
    load();
  }).catch(function(){err.innerHTML='<div class="alert a-err"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><div>Delete failed</div></div>';b.disabled=false});
});
</script>
</body>
</html>
