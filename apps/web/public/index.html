<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />

<meta name="twitter:description" content="Instant exam hall seating lookup for students and staff." />

<link rel="canonical" href="https://abhi122005.github.io/Exam-Seating/" />
<link rel="preload" href="/site.css" as="style">
<link rel="stylesheet" href="/site.css">
<style>
.wrap{max-width:42rem;margin:0 auto}
.h1{font-size:1.875rem;font-weight:800;letter-spacing:-.025em}
.sub{font-size:.875rem;color:var(--mfg)}
.b-live{border:1px solid rgba(16,185,129,0.2);background:rgba(16,185,129,0.1);color:#059669}.dark .b-live{color:#34d399}
.b-sched{border:1px solid rgba(245,158,11,0.2);background:rgba(245,158,11,0.1);color:#d97706}.dark .b-sched{color:#fbbf24}
.b-exp{border:1px solid var(--border);background:var(--muted);color:var(--mfg)}
.grid{display:grid;gap:1rem}
.exam-card{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem;border:1px solid var(--border);background:var(--card);border-radius:.75rem;box-shadow:0 1px 2px rgb(0 0 0/.05);text-decoration:none;color:var(--fg);transition:border-color .15s}
.exam-card:hover{border-color:var(--primary)}
.etitle{display:flex;align-items:center;gap:.5rem;font-weight:700}
.emeta{display:flex;align-items:center;gap:1rem;font-size:.75rem;color:var(--mfg);margin-top:.375rem}
.earrow{color:var(--mfg);transition:transform .15s,color .15s}
.exam-card:hover .earrow{color:var(--primary);transform:translateX(2px)}
.empty{padding:2rem;text-align:center;color:var(--mfg)}
.empty h3{font-weight:700;color:var(--fg);margin-bottom:.375rem;font-size:1rem}
.empty p{font-size:.75rem}
</style>
<script defer src="/polyfill.min.js"></script>
<script defer src="/theme.js"></script>
<script>try{var t=localStorage.getItem("theme");if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";if(t==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
</head>
<body>
<header><div class="hd"><a class="logo" href="/"><b>KTU</b>Exam Seating</a><nav><a class="staff" href="/admin/login"><svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>Staff Portal</a><button class="tbtn" id="tbtn" aria-label="Toggle theme"><svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button></nav></div></header>
<main><div class="wrap center mt2">
<h1 class="h1">Find My Exam Seat</h1>
<p class="sub mt">Select your exam session below to check your allocated hall &amp; seat instantly.</p>
<div id="list" class="mt2"></div>
</div></main>
<footer>KTU Exam Cell Seating Portal &middot; Fast &amp; Free</footer>
<script type="module">
import{esc}from'/esc.js';
import{statusFor}from'/seating.js';
var list=document.getElementById('list');
var cal='<svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
var clk='<svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
var arw='<svg class="ic earrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
list.innerHTML='<div class="loading"><span class="spinner"></span>Seating schedules streaming in...</div>';
fetch('/api/manifest').then(function(r){return r.json()}).then(function(data){
  if(!data.length){list.innerHTML='<div class="card empty"><svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:2rem;height:2rem;margin:0 auto .75rem;display:block;opacity:.6"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><h3>No Seating Schedules Released Yet</h3><p>Staff have not published any seating arrangements for today yet.</p></div>';return}
  list.innerHTML='<div class="grid"></div>';
  var g=list.firstChild,html='';
  data.forEach(function(e){
    var status=statusFor(e),label,cls;
    if(status==='live'){label='Live Now';cls='b-live'}
    else if(status==='expired'){label='Expired';cls='b-exp'}
    else{label='Scheduled';cls='b-sched'}
    html+='<a class="exam-card" href="/exam?id='+encodeURIComponent(e.examId)+'"><div><div class="etitle"><span>'+esc(e.title)+'</span><span class="badge '+cls+'">'+label+'</span></div><div class="emeta"><span>'+cal+esc(e.examDate)+'</span><span>'+clk+'Session: '+esc(e.session)+'</span></div></div>'+arw+'</a>';
  });
  g.innerHTML=html;
}).catch(function(){list.innerHTML='<div class="alert a-err">Failed to load schedules. Please refresh the page.</div>'});
</script>
</body>
</html>
