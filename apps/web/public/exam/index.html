<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)">
<title>Exam Seating | KTU Exam Seating Allocation Portal</title>
<link rel="stylesheet" href="/site.css">
<link rel="modulepreload" href="/seating.js">
<style>
.wrap{max-width:42rem;margin:0 auto}
.h1{font-size:1.875rem;font-weight:800;letter-spacing:-.025em}
.b-primary{border:1px solid rgba(59,130,246,0.2);background:rgba(59,130,246,0.1);color:var(--primary)}
.alert h3{font-size:.875rem;margin-bottom:.25rem}
.a-warn{border:1px solid rgba(245,158,11,0.2);background:rgba(245,158,11,0.1);color:#78350f}.dark .a-warn{color:#fde68a}
.a-mut{border:1px solid var(--border);background:var(--muted);color:var(--mfg)}
.sbox{position:relative}
.sinp{width:100%;padding:.75rem 6.5rem .75rem 1rem;border-radius:.75rem;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:1rem;outline:none;text-transform:uppercase;letter-spacing:.05em}
.sinp:focus{box-shadow:0 0 0 2px var(--primary)}
.find{position:absolute;right:.5rem;top:.5rem;bottom:.5rem;padding:0 .875rem;border:none;border-radius:.5rem;background:var(--primary);color:var(--pfg);font-size:.875rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:.375rem}
.find:disabled{opacity:.5}
.result{border:1px solid rgba(16,185,129,0.3);background:rgba(16,185,129,0.1);border-radius:1rem;padding:1.5rem;margin-top:1.5rem;box-shadow:0 4px 6px -1px rgb(0 0 0/.1)}
.rhead{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#059669}.dark .rhead{color:#34d399}
.room{font-size:3rem;font-weight:900;letter-spacing:-.025em;color:#059669;text-align:center;margin-top:.25rem;line-height:1.2}.dark .room{color:#34d399}
.rfoot{border-top:1px solid rgba(16,185,129,0.2);margin-top:1rem;padding-top:.75rem;font-size:.75rem;color:var(--mfg);display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}
@media(max-width:640px){.room{font-size:2.5rem}}
</style>
<script src="/polyfill.min.js"></script>
<script src="/theme.js"></script>
</head>
<body>
<header><div class="hd"><a class="logo" href="/"><b>KTU</b>Exam Seating</a><nav><a class="staff" href="/admin/login"><svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>Staff Portal</a><button class="tbtn" id="tbtn" aria-label="Toggle theme"><svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button></nav></div></header>
<main><div class="wrap">
<div class="center mt2">
<h1 id="title" class="h1">Exam Seating</h1>
<div class="badge b-primary mt2" id="session">Session: Morning</div>
</div>
<div id="content" class="mt2"></div>
</div></main>
<footer>KTU Exam Cell Seating Portal &middot; Fast &amp; Free</footer>
<script type="module">
import{esc}from'/esc.js';
import{findSeat,runSeatingApp}from'/seating.js';
var id=new URLSearchParams(location.search).get('id'),content=document.getElementById('content'),payload=null;
var ic=function(p){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'};
var I={clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',alert:'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'};
if(!id){content.innerHTML='<div class="alert a-err">'+ic(I.alert)+'<div>Missing exam id in the link. Please use the link provided by your exam cell.</div></div>'}
else{
  content.innerHTML='<div class="loading"><span class="spinner"></span>Loading seating data...</div>';
  runSeatingApp({
    examId:id,
    onPayload:function(d){
      payload=d;
      document.title=(d.title||'Exam Seating')+' | KTU Exam Seating';
      document.getElementById('title').textContent=d.title||'Exam Seating';
      document.getElementById('session').textContent='Session: '+(d.session||'Morning');
    },
    onStatus:function(status){
      if(status==='scheduled')content.innerHTML='<div class="alert a-warn">'+ic(I.clock)+'<div><h3>Seating Not Released Yet</h3>Seating allocation for this slot will be released at <b>'+esc(new Date(payload.publishAt).toLocaleString())+'</b>.<br><span class="muted">This page updates automatically when the release goes live.</span></div></div>';
      else if(status==='expired')content.innerHTML='<div class="alert a-mut">'+ic(I.alert)+'<div><h3>Seating Link Expired</h3>This seating arrangement release window has closed and data has been safely cleared.</div></div>';
      else{
        content.innerHTML='<form id="form" class="sbox"><input id="roll" class="sinp" type="text" placeholder="Enter Roll / Reg No (e.g. CS24C08)" required maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="find" class="find" type="submit" disabled>'+ic(I.search)+'Find Seat</button></form><div id="result" class="mt2"></div>';
        var inp=document.getElementById('roll'),find=document.getElementById('find');
        inp.oninput=function(){find.disabled=!inp.value.trim();document.getElementById('result').innerHTML=''};
        document.getElementById('form').onsubmit=search;
      }
    },
    onError:function(kind){
      if(kind==='notfound'){content.innerHTML='<div class="alert a-err">'+ic(I.alert)+'<div>Exam not found. It may have been removed or the link is incorrect.</div></div>';return}
      content.innerHTML='<div class="loading"><span class="spinner"></span>Retrying connection...</div>';
    }
  });
}
function search(e){
  e.preventDefault();
  var q=document.getElementById('roll').value.trim().toUpperCase();if(!q)return;
  var out=findSeat(payload,q),r=document.getElementById('result');
  if(out){
    r.innerHTML='<div class="result"><div class="rhead"><span>Seat Allocated</span>'+ic(I.pin)+'</div><div class="center"><div class="muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600">Room Number</div><div class="room">'+esc(out.room_no)+'</div></div><div class="rfoot"><span>'+ic(I.book)+' '+esc(out.label)+'</span>'+(out.roll_from&&out.roll_to?'<span class="mono">Range: '+esc(out.roll_from)+' - '+esc(out.roll_to)+'</span>':'')+'</div></div>';
  }else{
    r.innerHTML='<div class="alert a-err">'+ic(I.alert)+'<div>No seat matching <b>'+esc(q)+'</b> found in this session.</div></div>';
  }
}
</script>
</body>
</html>
