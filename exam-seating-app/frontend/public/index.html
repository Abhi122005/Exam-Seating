<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Instant exam hall seating lookup for students and staff">
<title>Exam Seating Allocation Portal</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<nav class="nav"><a class="brand" href="/"><b>KTU</b>Exam Seating</a><div class="links"><a class="lnk" href="/admin/login">Staff Portal</a></div></nav>
<main>
<div class="page">
<div class="hero">
<h1>Exam Seating Allocation</h1>
<p class="sub">Instant, real-time exam hall seating lookup — select your session below.</p>
<p class="hint landing-help">Students scan the QR code published by staff to jump straight to their exam.</p>
</div>
<div id="list" class="list"></div>
</div>
</main>
<footer>Exam Seating Allocation Portal &middot; Fast &amp; Free</footer>
<script type="module">
import{esc,statusFor}from'/seating.js';
var list=document.getElementById('list');
var cal='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
var clk='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
var arw='<svg class="earrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
var fmt=function(e){
  var s=statusFor(e),label,cls;
  if(s==='live'){label='Live Now';cls='b-live'}
  else if(s==='expired'){label='Expired';cls='b-expired'}
  else{label='Scheduled';cls='b-scheduled'}
  return '<a class="exam-card" href="/exam?id='+encodeURIComponent(e.examId)+'"><div><div class="etitle"><span>'+esc(e.title)+'</span><span class="badge '+cls+'">'+label+'</span></div><div class="emeta"><span>'+cal+' '+esc(e.examDate)+'</span><span>'+clk+' '+(e.session==='FN'?'Forenoon':'Afternoon')+'</span></div></div>'+arw+'</a>';
};
list.innerHTML='<div class="loading"><span class="spinner"></span>Seating schedules streaming in...</div>';
fetch('/api/manifest').then(function(r){return r.json()}).then(function(data){
  if(!data.length){list.innerHTML='<div class="empty"><h3>No Seating Schedules Released Yet</h3><p>Staff have not published any seating arrangements yet.</p></div>';return}
  list.innerHTML=data.map(fmt).join('');
}).catch(function(){list.innerHTML='<div class="empty"><h3>Failed to load schedules</h3><p>Please refresh the page and try again.</p></div>'});
</script>
</body>
</html>
